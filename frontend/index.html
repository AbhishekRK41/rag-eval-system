<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RAG Eval System — Policy Assistant</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e8ec; --muted:#9aa2af; --accent:#6ea8fe; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .row { display:flex; gap:8px; margin-bottom: 16px; }
  select, input[type=text] { background:var(--panel); border:1px solid var(--border); color:var(--text); padding:10px 12px; border-radius:8px; font-size:14px; }
  input[type=text] { flex:1; }
  select { flex: 0 0 220px; }
  button { background:var(--accent); border:none; color:#0f1115; font-weight:600; padding:10px 18px; border-radius:8px; cursor:pointer; }
  button:disabled { opacity:0.5; cursor:default; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:12px; }
  .answer { white-space:pre-wrap; line-height:1.5; font-size:14px; }
  .mode { display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; margin-bottom:10px; }
  .mode.llm { background:#1f3d2c; color:#7ee2a8; }
  .mode.extractive_fallback { background:#3d2f1f; color:#f0b869; }
  .sources { margin-top: 12px; }
  .src { border-top:1px solid var(--border); padding-top:10px; margin-top:10px; font-size:12px; color:var(--muted); }
  .src b { color: var(--text); }
  .score { float:right; font-family: monospace; }
  #status { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Policy Assistant — RAG Eval System</h1>
  <div class="sub">Hybrid retrieval (BM25 + TF-IDF/SVD, RRF-fused, lexically reranked) over a 10-document corporate policy corpus.</div>

  <div class="row">
    <input id="q" type="text" placeholder="e.g. How many days of earned leave do I accrue per month?" />
    <select id="strategy">
      <option value="hybrid_rrf_reranked">Hybrid + Reranked</option>
      <option value="hybrid_rrf">Hybrid (RRF)</option>
      <option value="sparse_bm25">BM25 only</option>
      <option value="dense_tfidf_svd">Dense only</option>
    </select>
    <button id="ask">Ask</button>
  </div>
  <div id="status"></div>
  <div id="results"></div>
</div>

<script>
const API_BASE = window.location.origin.includes("5500") || window.location.protocol === "file:"
  ? "http://localhost:8000" : "";

async function ask() {
  const question = document.getElementById("q").value.trim();
  if (!question) return;
  const strategy = document.getElementById("strategy").value;
  const btn = document.getElementById("ask");
  const status = document.getElementById("status");
  btn.disabled = true;
  status.textContent = "Retrieving + generating...";

  try {
    const res = await fetch(`${API_BASE}/query`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, strategy, top_k: 5 })
    });
    const data = await res.json();
    status.textContent = "";
    renderResult(question, data);
  } catch (e) {
    status.textContent = "Error: " + e.message + " — is the API running on :8000?";
  } finally {
    btn.disabled = false;
  }
}

function renderResult(question, data) {
  const results = document.getElementById("results");
  const card = document.createElement("div");
  card.className = "card";
  const modeClass = data.mode === "llm" ? "llm" : "extractive_fallback";
  const modeLabel = data.mode === "llm" ? "LLM generated" : "Extractive fallback (no API key)";
  card.innerHTML = `
    <div class="mode ${modeClass}">${modeLabel} · strategy: ${data.strategy_used}</div>
    <div><b>Q:</b> ${escapeHtml(question)}</div>
    <div class="answer">${escapeHtml(data.answer)}</div>
    <div class="sources">
      ${data.sources.map(s => `
        <div class="src">
          <span class="score">${s.score}</span>
          <b>${s.doc_id}</b> (${s.chunk_id})<br/>${escapeHtml(s.text)}...
        </div>`).join("")}
    </div>
  `;
  results.prepend(card);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById("ask").addEventListener("click", ask);
document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
</script>
</body>
</html>
